version: 2
updates:
  # ─── npm / pnpm dependencies ─────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 10
    reviewers:
      - "@vonwork/maintainers"
    labels:
      - "dependencies"
      - "automated"
    groups:
      # Group all minor/patch updates together to reduce PR noise
      minor-and-patch:
        update-types:
          - minor
          - patch
      # Major updates get individual PRs for careful review
    ignore:
      # Ignore major version bumps for core framework dependencies
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@trpc/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "drizzle-orm"
        update-types: ["version-update:semver-major"]

  # ─── GitHub Actions ───────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels:
      - "dependencies"
      - "github-actions"
      - "automated"
