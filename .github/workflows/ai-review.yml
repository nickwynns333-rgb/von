name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ai-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Get the diff ──────────────────────────────────────────────────────────
      - name: Get PR diff
        id: diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD -- '*.ts' '*.tsx' > /tmp/pr_diff.txt
          echo "diff_size=$(wc -c < /tmp/pr_diff.txt)" >> $GITHUB_OUTPUT

      # ── AI Review via OpenAI / OpenRouter ─────────────────────────────────────
      - name: AI Code Review
        if: steps.diff.outputs.diff_size > 100
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          DIFF=$(head -c 8000 /tmp/pr_diff.txt)
          
          REVIEW=$(curl -s https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"model\": \"anthropic/claude-3-haiku\",
              \"messages\": [{
                \"role\": \"system\",
                \"content\": \"You are an expert TypeScript/React/Node.js code reviewer. Review the following PR diff for: (1) bugs and logic errors, (2) security issues (SQL injection, prompt injection, XSS, exposed secrets), (3) TypeScript type safety, (4) performance issues, (5) missing error handling. Be concise. Format as markdown with sections. If the code looks good, say so briefly.\"
              }, {
                \"role\": \"user\",
                \"content\": \"Review this PR diff:\n\n\`\`\`diff\n${DIFF}\n\`\`\`\"
              }]
            }" | jq -r '.choices[0].message.content // "AI review unavailable"')
          
          # Post review as PR comment
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments" \
            -d "{\"body\": \"## 🤖 AI Code Review\n\n${REVIEW}\n\n---\n*Automated review by VonWork AI — not a substitute for human review*\"}"
